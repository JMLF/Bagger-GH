# Copy this file to secrets.toml (git-ignored) and put your GitHub token(s) in it.
# A fine-grained or classic personal access token with public read access is enough.
# Several tokens (ideally from different accounts) are used in rotation.
# Alternative: export GITHUB_TOKEN=ghp_xxx (comma-separated for several tokens).
[github]
token = "ghp_REPLACE_ME"
# tokens = ["ghp_first", "ghp_second"]
