# ml-repo-sampler configuration.
# Relative paths are resolved from the directory of this file.
# Select heuristics with `enabled = true/false` here, or on the CLI with
# --query/-q NAME (only these queries), --enable/-e NAME, --disable/-d NAME.

[run]
name = "ml-pipelines"          # prefix of the run directory: <output_dir>/<name>-<timestamp>
output_dir = "runs"
log_level = "INFO"             # console level; run.log always holds DEBUG
progress = true                # tqdm progress bars (auto-hidden when not in a terminal; CLI: --no-progress)
plugins = []                   # Python files defining extra heuristic types (see docs/extending.md)

[github]
token_file = "secrets.toml"    # TOML file with [github] token = "..." or tokens = [...]
token_env = "GITHUB_TOKEN"     # takes precedence over token_file if set (comma-separated allowed)
per_page = 100
max_pages = 10                 # 10 x 100 = GitHub's 1000 results cap per query
search_min_interval = 6.5      # seconds between search calls (code search: 10 req/min per user)
core_min_interval = 0.0        # seconds between /repos calls (5000 req/h per user)
timeout = 30
max_retries = 6
count_commits = false           # enrich: +1 call per repo to store commit_count (min_commits)

# ---------------------------------------------------------------------------
# STEP 1 - Search heuristics
# type = "code"         -> GET /search/code (qualifiers: language:, path:, filename:, extension:, repo:, org:)
#                          Must contain at least one search term besides qualifiers.
# type = "repositories" -> GET /search/repositories (qualifiers: topic:, stars:, created:, pushed:, language:)
# partitions: each entry is appended to the query and run separately, to get past the
#             1000-results cap (e.g. ["size:<1000", "size:1000..5000", "size:>5000"]).
# auto_partition: true (or a qualifier: "size" for code; "created", "pushed", "stars",
#             "forks", "size" for repositories) splits the query on that qualifier range,
#             recursively, until every slice has <= 1000 results. This collects ALL results,
#             at about total_count / 100 search calls (10 per minute and per token).
#             auto_partition_range = [low, high] bounds the range (defaults: size 0..1000000
#             bytes for code, created 2008-01-01..today).
# ---------------------------------------------------------------------------

[search]
default_partitions = []        # used by queries that do not define `partitions`
auto_partition = false         # default for queries that do not set `auto_partition`
# max_hits = 20000             # default for queries that do not set `max_hits`: stop a query after
                               # this many distinct hits (resumable; raise it later to fetch more)
# sampling = "stratified"      # how max_hits is reached: "ordered" (lowest part of the range first)
                               # or "stratified" (proportional share of every slice; needs auto_partition)

[[search.queries]]
name = "sklearn_pipeline"
library = "scikit-learn"
query = '"from sklearn.pipeline import Pipeline" language:Python'

[[search.queries]]
name = "keras_sequential"
library = "tensorflow"
query = '"tf.keras.Sequential" language:Python'

[[search.queries]]
name = "torch_sequential"
library = "pytorch"
query = '"torch.nn.Sequential" language:Python'

[[search.queries]]
name = "xgboost"
library = "xgboost"
query = '"import xgboost" language:Python'

[[search.queries]]
name = "lightgbm"
library = "lightgbm"
query = '"import lightgbm" language:Python'

[[search.queries]]
name = "mlflow_project"
library = "mlflow"
query = 'entry_points filename:MLproject'

[[search.queries]]
name = "dvc_pipeline"
library = "dvc"
query = 'stages filename:dvc.yaml'

[[search.queries]]
name = "kubeflow_pipeline"
library = "kubeflow"
query = '"kfp.dsl.pipeline" language:Python'

[[search.queries]]
name = "airflow_dag"
library = "airflow"
query = '"from airflow import DAG" language:Python'

# Examples of extra heuristics, disabled by default.
[[search.queries]]
name = "xgboost_from"
library = "xgboost"
query = '"from xgboost import" language:Python'
enabled = false

[[search.queries]]
name = "topic_mlops"
library = "mlops"
type = "repositories"
query = 'topic:mlops stars:>=2 created:>2022-12-31'
enabled = false

# ---------------------------------------------------------------------------
# STEPS 2-3 - Filtering heuristics
# [heuristics.<name>]   <name> is free; `type` defaults to <name>.
#   enabled = true|false
#   action  = "exclude" (drop failing items) | "flag" (keep them, only annotate)
# Stages: hit (each file) -> aggregate (per repo, before enrichment, saves API quota)
#         -> repo (after fetching repo metadata).
# `ml-repo-sampler list` shows every available type and its parameters.
# ---------------------------------------------------------------------------

# Noise n°1: path of the hit contains example/tutorial/test keywords.
# match = "token" matches whole words of the path (test_x.py, tests/) but not "latest/".
[heuristics.path_noise]
enabled = true
action = "exclude"
match = "token"
patterns = ["example", "examples", "tutorial", "tutorials", "demo", "demos",
            "sample", "samples", "test", "tests", "docs"]

# Noise n°2: multiplicity. Passes if nb_hits >= min_hits AND
# (files >= min_distinct_files OR libs >= min_distinct_libs)  [combine = "any"; "all" for AND]
[heuristics.multiplicity]
enabled = true
action = "exclude"
min_distinct_files = 2
min_distinct_libs = 2
min_hits = 1
combine = "any"

# Noise n°4: forks (known from search results, so applied before enrichment).
[heuristics.exclude_forks]
enabled = true
action = "exclude"

# Noise n°3: minimum stars.
[heuristics.min_stars]
enabled = true
action = "exclude"
min_stars = 2

# Noise n°5: topics / description. negative_topics match whole topics exactly
# (so "learning" does not reject "machine-learning"); negative_keywords match whole
# words of the repo name/description.
[heuristics.topics]
enabled = true
action = "exclude"
negative_topics = ["tutorial", "tutorials", "course", "courses", "learning", "bootcamp"]
negative_keywords = ["tutorial", "tutorials", "course", "courses", "bootcamp"]
keyword_fields = ["name", "description"]
positive_topics = ["machine-learning", "mlops", "scikit-learn", "deep-learning",
                   "pytorch", "tensorflow", "ml-pipeline", "data-science"]
require_positive = false

# Noise n°6: freshness (study window and recent activity).
[heuristics.created_window]
enabled = true
action = "exclude"
after = 2022-12-31
# before = 2026-06-30

[heuristics.recent_activity]
type = "pushed_window"
enabled = true
action = "flag"
after = 2025-01-01

# Repo must have more than a single commit (e.g. drops one-shot uploads).
# Needs [github] count_commits = true (one extra API call per enriched repo).
[heuristics.min_commits]
enabled = false
action = "exclude"
min_commits = 2

[heuristics.not_archived]
enabled = false
action = "exclude"

[heuristics.language]
enabled = false
action = "exclude"
languages = ["Python", "Jupyter Notebook"]

# Generic rule on any column of repos_evaluated.csv (op: ==, !=, >, >=, <, <=, in,
# not_in, contains, not_contains, regex). stage = "aggregate" or "repo".
[heuristics.min_size]
type = "field"
enabled = false
action = "exclude"
stage = "repo"
field = "size_kb"
op = ">="
value = 50

# ---------------------------------------------------------------------------
# Optional random sample of the final candidates -> sample.csv (size = 0 disables)
# ---------------------------------------------------------------------------
[sampling]
size = 0
seed = 42
