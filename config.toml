# ---------------------------------------------------------------------------
# STEPS 2-3 - Filtering heuristics
# [heuristics.<name>]   <name> is free; `type` defaults to <name>.
#   enabled = true|false
#   action  = "exclude" (drop failing items) | "flag" (keep them, only annotate)
# Stages: hit (each file) -> aggregate (per repo, before enrichment, saves API quota)
#         -> repo (after fetching repo metadata).
# `ml-repo-sampler list` shows every available type and its parameters.
# ---------------------------------------------------------------------------

# Noise n°1: path of the hit contains example/tutorial/test keywords.
# match = "token" matches whole words of the path (test_x.py, tests/) but not "latest/".
[heuristics.path_noise]
enabled = true
action = "exclude"
match = "token"
patterns = ["example", "examples", "tutorial", "tutorials", "demo", "demos",
            "sample", "samples", "test", "tests", "docs", "site-packages",
            "dataset", "datasets", "agent", "agents", "course", "courses",
            "lecture", "lectures", "lesson", "lessons"]
# Maybe find a way to exclude benchmark repo (https://github.com/PCART-tools/PCBench) and reproduction package?


# Noise n°2: multiplicity. Passes if nb_hits >= min_hits AND
# (files >= min_distinct_files OR libs >= min_distinct_libs)  [combine = "any"; "all" for AND]
[heuristics.multiplicity]
enabled = false
action = "exclude"
min_distinct_files = 2
min_distinct_libs = 2
min_hits = 3
# combine = "any"
combine = "all"

# Noise n°4: forks (known from search results, so applied before enrichment).
[heuristics.exclude_forks]
enabled = true
action = "exclude"

# Noise n°3: minimum stars.
[heuristics.min_stars]
enabled = false
action = "exclude"
min_stars = 2

# Noise n°5: topics / description. negative_topics match whole topics exactly
# (so "learning" does not reject "machine-learning"); negative_keywords match whole
# words of the repo name/description.
[heuristics.topics]
enabled = false
action = "exclude"
negative_topics = ["tutorial", "tutorials", "course", "courses", "learning", "bootcamp"]
negative_keywords = ["tutorial", "tutorials", "course", "courses", "bootcamp"]
keyword_fields = ["name", "description"]
positive_topics = ["machine-learning", "mlops", "scikit-learn", "deep-learning",
                   "pytorch", "tensorflow", "ml-pipeline", "data-science"]
require_positive = false

# Noise n°6: freshness (study window and recent activity).
[heuristics.created_window]
enabled = false
action = "exclude"
after = 2022-12-31
# before = 2026-06-30
# ToDo: Unclear that after works in reverse chronological order

[heuristics.recent_activity]
type = "pushed_window"
enabled = true
# action = "flag"
action = "exclude"
after = 2025-01-01

# Repo must have more than a single commit (e.g. drops one-shot uploads).
# Needs [github] count_commits = true (one extra API call per enriched repo).
[heuristics.min_commits]
enabled = true
action = "exclude"
min_commits = 3

[heuristics.not_archived]
enabled = false
action = "exclude"

[heuristics.language]
enabled = true
action = "exclude"
languages = ["Python", "Jupyter Notebook"]

# Generic rule on any column of repos_evaluated.csv (op: ==, !=, >, >=, <, <=, in,
# not_in, contains, not_contains, regex). stage = "aggregate" or "repo".
[heuristics.min_size]
type = "field"
enabled = false
action = "exclude"
stage = "repo"
field = "size_kb"
op = ">="
value = 50

# ---------------------------------------------------------------------------
# Optional random sample of the final candidates -> sample.csv (size = 0 disables)
# ---------------------------------------------------------------------------
[sampling]
size = 30
seed = 42
